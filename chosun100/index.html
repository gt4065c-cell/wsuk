<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f0d0c">
<title>조선 100인</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* 레이아웃: 먹빛 바탕 위 넷플릭스식 가로 줄. 시대마다 단청 색 한 가지로 포스터를 칠한다. */
:root{
  --ink:#0f0d0c;        /* 먹 */
  --ink-2:#1b1816;      /* 한지 그늘 */
  --ink-3:#2a2522;
  --paper:#f1e9dc;      /* 한지 */
  --paper-dim:#b9ad9c;
  --cinnabar:#c8402e;   /* 주홍(단청) */
  --gold:#d9a441;
  --display:"Gowun Batang","Nanum Myeongjo",serif;
  --body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ink);color:var(--paper);font-family:var(--body);-webkit-font-smoothing:antialiased}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* 상단 바 */
header{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding-block:12px;
  padding-top:calc(12px + env(safe-area-inset-top,0px));
  background:var(--ink);border-bottom:1px solid var(--ink-2)}
.brand{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.02em;white-space:nowrap}
.brand b{color:var(--cinnabar)}
.search{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--ink-2);border:1px solid var(--ink-3);
  border-radius:999px;padding:6px 12px;min-width:0;flex:0 1 260px}
.search input{background:none;border:0;color:var(--paper);font:inherit;font-size:14px;width:100%;min-width:0;outline:none}
.search svg{flex:none;opacity:.6}

/* 히어로 */
.hero{position:relative;padding-block:28px 24px;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:
  radial-gradient(120% 90% at 85% 10%,var(--hc,#7a1f1f) 0%,transparent 60%),
  linear-gradient(180deg,transparent 60%,var(--ink));opacity:.85;z-index:-1}
.hero .hanja{position:absolute;right:max(8px,4vw);top:8px;font-family:var(--display);font-size:clamp(120px,28vw,260px);
  line-height:1;color:var(--paper);opacity:.08;pointer-events:none;writing-mode:vertical-rl}
.eyebrow{font-size:12px;letter-spacing:.14em;color:var(--gold);font-weight:700}
.hero h1{font-family:var(--display);font-size:clamp(40px,9vw,72px);margin:8px 0 4px;line-height:1.05}
.hero .role{color:var(--paper-dim);font-size:14px}
.hero p{font-family:var(--display);font-size:clamp(17px,3.6vw,22px);line-height:1.55;max-width:30em;margin:14px 0 20px;text-wrap:balance}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border-radius:6px;font-weight:700;font-size:15px}
.btn.primary{background:var(--paper);color:var(--ink)}
.btn.ghost{background:rgba(241,233,220,.16)}
.btn:active{transform:scale(.97)}

/* 주제 칩 */
.chips{display:flex;gap:8px;overflow-x:auto;padding-block:4px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 14px;border-radius:999px;border:1px solid var(--ink-3);font-size:13px;color:var(--paper-dim);background:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--cinnabar);border-color:var(--cinnabar);color:#fff}

/* 가로 줄 */
.row{margin-top:22px}
.row h2{font-size:17px;font-weight:700;margin:0 0 10px;display:flex;align-items:baseline;gap:10px}
.row h2 small{font-weight:400;font-size:12px;color:var(--paper-dim)}
.rail{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;scrollbar-width:none;
  scroll-padding-left:max(16px,env(safe-area-inset-left,0px))}
.rail::-webkit-scrollbar{display:none}
.rail::after{content:"";flex:0 0 6px}

/* 포스터 카드 */
.card{flex:none;width:clamp(118px,30vw,168px);scroll-snap-align:start;text-align:left;position:relative}
.poster{aspect-ratio:2/3;max-width:100%;border-radius:6px;position:relative;overflow:hidden;
  /* 인물 그림(img/NNN.jpg)이 있으면 배경으로, 없으면 시대 색만 보인다 */
  background:
    linear-gradient(180deg,rgba(0,0,0,.35) 0%,transparent 22%,transparent 45%,rgba(0,0,0,.82) 100%),
    var(--img,none) center/cover no-repeat,
    repeating-linear-gradient(135deg,rgba(255,255,255,.035) 0 2px,transparent 2px 9px),
    linear-gradient(160deg,var(--c1) 0%,var(--c2) 100%);
  box-shadow:0 6px 18px rgba(0,0,0,.45);transition:transform .2s}
.card:hover .poster{transform:translateY(-3px)}
.poster .no{position:absolute;top:8px;left:9px;font-size:11px;letter-spacing:.08em;opacity:.75;font-variant-numeric:tabular-nums}
.poster .nm{position:absolute;left:9px;right:9px;bottom:30px;font-family:var(--display);font-weight:700;
  font-size:clamp(20px,5vw,26px);line-height:1.15;text-wrap:balance;text-shadow:0 2px 8px rgba(0,0,0,.4)}
.poster .rl{position:absolute;left:9px;right:9px;bottom:10px;font-size:11px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.poster .seal{position:absolute;right:9px;bottom:30px;width:22px;height:22px;border:1.5px solid rgba(241,233,220,.5);
  border-radius:3px;font-family:var(--display);font-size:13px;display:grid;place-items:center;opacity:.7}
.prog{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(0,0,0,.4)}
.prog i{display:block;height:100%;background:var(--cinnabar)}

/* 검색 결과 격자 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:12px;margin-top:16px}
.grid .card{width:auto}
.empty{color:var(--paper-dim);padding:40px 0;text-align:center}

/* 상세 시트 */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.sheet-bg.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-height:92vh;overflow-y:auto;background:var(--ink-2);
  border-radius:16px 16px 0 0;transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);
  padding-bottom:calc(100px + env(safe-area-inset-bottom,0px))}
.sheet.on{transform:none}
@media(min-width:760px){.sheet{left:50%;width:640px;margin-left:-320px}}
.sheet-top{position:relative;padding-block:28px 22px;background:linear-gradient(160deg,var(--c1),var(--c2));border-radius:16px 16px 0 0;overflow:hidden}
.sheet-top .hanja{position:absolute;right:12px;top:-6px;font-family:var(--display);font-size:150px;opacity:.1;writing-mode:vertical-rl;line-height:1}
.close{position:absolute;top:12px;right:max(12px,env(safe-area-inset-right,0px));width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.4);font-size:20px;line-height:36px}
.sheet h3{font-family:var(--display);font-size:38px;margin:6px 0 2px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{font-size:12px;padding:3px 9px;border-radius:999px;background:rgba(0,0,0,.3)}
.sheet .copy{font-family:var(--display);font-size:19px;line-height:1.6;margin:18px 0}
.sheet .sec{padding-block:18px 0}
.sheet .sec h4{font-size:14px;color:var(--paper-dim);margin:0 0 10px;font-weight:500}
.pair{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none}
.pair .card{width:110px}

/* 하단 플레이어 */
.player{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(27,24,22,.97);backdrop-filter:blur(10px);
  border-top:1px solid var(--ink-3);padding-block:8px calc(8px + env(safe-area-inset-bottom,0px));transform:translateY(110%);transition:transform .25s}
.player.on{transform:none}
.pl-row{display:flex;align-items:center;gap:12px}
.thumb{width:40px;height:56px;border-radius:4px;flex:none;background:linear-gradient(160deg,var(--c1),var(--c2));
  font-family:var(--display);font-weight:700;display:grid;place-items:center;font-size:15px}
.pl-info{min-width:0;flex:1}
.pl-info b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-info span{font-size:12px;color:var(--paper-dim);font-variant-numeric:tabular-nums}
.ctl{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none}
.ctl.play{background:var(--paper);color:var(--ink);width:46px;height:46px}
.ctl small{font-size:10px;position:absolute;margin-top:2px}
.speed{font-size:13px;font-weight:700;padding:6px 8px;border-radius:6px;background:var(--ink-3);flex:none;font-variant-numeric:tabular-nums}
.bar{margin-top:8px;height:18px;display:flex;align-items:center;cursor:pointer;touch-action:none}
.bar .track{height:4px;width:100%;background:var(--ink-3);border-radius:2px;position:relative}
.bar .fill{position:absolute;inset:0 auto 0 0;background:var(--cinnabar);border-radius:2px}
.bar .buf{position:absolute;inset:0 auto 0 0;background:rgba(241,233,220,.15);border-radius:2px}
.status{font-size:12px;color:var(--gold);margin-top:2px;min-height:0}
@media(max-width:420px){.hide-sm{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
footer{color:var(--paper-dim);font-size:12px;padding-block:40px 20px;line-height:1.7}
</style>
</head>

[90,"오경석","역관·개화사상가","외국어와 책을 통해 세계의 변화를 읽고 개화의 씨앗을 뿌리다.","역관·개화","개항기","13F4lKYBYSAW8-Nvnk-udGHDjxLmF4PpC"],
[91,"유홍기","중인·개화사상가","이름보다 사상으로 젊은 개화파의 뒤를 밀어 준 숨은 스승.","스승·개화","개항기","1ZxWyBp2odjWl24EO_pM1hVu0gpG5oNKU"],
[92,"강위","문인·개화사상가","전통 지식인의 눈으로 국제질서의 변화를 읽고 개혁을 모색하다.","전환·개화","개항기","1nzG-3BSxmLnRne8VlH-cG2hKqmdIYiqG"],
[93,"홍영식","문신·개화파","우편제도를 열었으나 사흘 천하의 정변과 함께 생을 마치다.","혁신·좌절","개항기","1r-ppqN775XaBK9E_yo9E7JyjQhprBeSN"],
[94,"김옥균","문신·개화파","나라를 단숨에 바꾸려 한 조급한 혁명이 망명과 암살로 끝나다.","개혁·속도","개항기","1BkzGYPlLv2LyQOK6UBoKrU3toYhaW-t7"],

[99,"나철","독립운동가·종교인","을사오적 처단 투쟁에서 민족종교의 부흥으로 독립의 길을 넓히다.","독립·정신","대한제국기","1arc6DV1DKR0d2DJHBx5g_r03igrA-r7u"],
[100,"안중근","의병장·독립운동가","한 발의 총성과 동양평화론으로 침략의 시대에 책임을 묻다.","독립·평화","대한제국기","1icmHLt8xLggkXkV0QBPjtgDXNy96lAKN"]
].map(([n,name,role,copy,theme,era,id])=>({n,name,role,copy,themes:theme.split('·'),era,id}));

// 시대별 단청 색(위, 아래)과 시대 설명
const ERAS = {
  "조선 건국기":["#9a3a2c","#3b1612","건국과 권력 설계"],
  "조선 전기":["#2f6b5a","#11261f","제도 형성과 희생"],
  "사림 성장기":["#7d6a32","#2a2410","사림·예술·신분 갈등"],
  "임진왜란기":["#8a2323","#2a0b0b","전쟁 속 선택과 책임"],
  "광해군·인조기":["#3e5480","#121a2b","명분과 생존의 충돌"],
  "17세기":["#6a4670","#221626","제도·민생·비주류 지식"],
  "18세기":["#2f6f80","#0f242b","실학과 문화의 확장"],
  "19세기 전반":["#86592f","#2b1c0f","유배·과학·민란"],
  "19세기 후반":["#5b7a33","#1c2610","평등사상과 농민혁명"],
  "개항기":["#33528a","#0f182b","개화와 좌절"],
  "대한제국기":["#7a3348","#260f17","국권 위기와 독립"]
};
// 주제 묶음 (칩 + 특별 줄)
const SHELVES = [
  {key:"여성",label:"여성의 목소리",test:p=>p.themes.includes("여성")},
  {key:"의병",label:"칼을 든 선비들 · 의병",test:p=>/의병/.test(p.themes.join()+p.role)},
  {key:"예술",label:"붓과 소리 · 예술가",test:p=>p.themes.some(t=>/예술|음악|문학/.test(t))},
  {key:"개혁",label:"개혁과 좌절",test:p=>p.themes.some(t=>/개혁|좌절|혁신|속도/.test(t))},
  {key:"과학",label:"과학과 실학",test:p=>p.themes.some(t=>/과학|실학|기술|의학|지도/.test(t))},
  {key:"저항",label:"아래로부터의 저항",test:p=>p.themes.some(t=>/저항|혁명|반란|민중/.test(t))},
  {key:"비극",label:"비극으로 끝난 이름",test:p=>p.themes.some(t=>/비극/.test(t))}
];
// 함께 들으면 좋은 짝(논쟁·대비)
const PAIRS = {1:[2,6],2:[1,7],54:[55],55:[54],29:[30,26],30:[29,34],76:[77],77:[76],80:[81],81:[80],87:[88,89],88:[87],89:[88,85],93:[94],94:[93,95],17:[18,19],18:[17],35:[36,37],27:[47,32],47:[27]};

const $ = s=>document.querySelector(s);
const store = {
  get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
const pos = store.get('jsn_pos',{});      // {n:{t,d}}
const esc = s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = s=>{s=Math.max(0,Math.floor(s||0));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=String(s%60).padStart(2,'0');return h?`${h}:${String(m).padStart(2,'0')}:${x}`:`${m}:${x}`};
const colors = p=>ERAS[p.era]||["#555","#222"];
const firstChar = p=>p.name.replace(/^(사명대사|신덕왕후|폐비|빙허각)\s*/,'').charAt(0);

function card(p){
  const [c1,c2]=colors(p); const pr=pos[p.n];
  const pct = pr&&pr.d ? Math.min(100,pr.t/pr.d*100) : 0;
  return `<button class="card" data-n="${p.n}" aria-label="${esc(p.name)} 자세히 보기">
    <div class="poster" style="--c1:${c1};--c2:${c2};--img:url('img/${String(p.n).padStart(3,'0')}.jpg')">
      <span class="no">No.${String(p.n).padStart(3,'0')}</span>
      <span class="nm">${esc(p.name)}</span>
      <span class="seal">${esc(firstChar(p))}</span>
      <span class="rl">${esc(p.role)}</span>
      ${pct?`<span class="prog"><i style="width:${pct}%"></i></span>`:''}
    </div></button>`;
}
function row(title,sub,list){
  if(!list.length) return '';
  return `<section class="row"><h2 class="gutter">${esc(title)} ${sub?`<small>${esc(sub)}</small>`:''}</h2>
    <div class="rail gutter">${list.map(card).join('')}</div></section>`;
}

/* ---------- 히어로: 날짜마다 바뀌는 오늘의 인물 ---------- */
function renderHero(){
  const d=new Date(); const seed=(d.getFullYear()*372+d.getMonth()*31+d.getDate());
  const p=P[seed%P.length]; const [c1]=colors(p);
  const hero=$('#hero'); hero.style.setProperty('--hc',c1);
  const r=pos[p.n];
  hero.innerHTML=`<div class="hanja" aria-hidden="true">${esc(firstChar(p))}</div>
    <div class="eyebrow">오늘의 인물 · ${esc(p.era)}</div>
    <h1>${esc(p.name)}</h1>
    <div class="role">${esc(p.role)} · ${p.themes.map(esc).join(' · ')}</div>
    <p>${esc(p.copy)}</p>
    <div class="actions">
      <button class="btn primary" id="heroPlay"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4l14 8-14 8z"/></svg>${r&&r.t>5?'이어 듣기':'듣기'}</button>
      <button class="btn ghost" id="heroInfo">자세히</button>
    </div>`;
  $('#heroPlay').onclick=()=>play(p.n);
  $('#heroInfo').onclick=()=>openSheet(p.n);
}

/* ---------- 줄 ---------- */
let activeChip=null;
function renderRows(){
  const recent = store.get('jsn_recent',[]).map(n=>P[n-1]).filter(p=>p&&pos[p.n]&&pos[p.n].t>5&&!pos[p.n].done);
  let html = row('이어 듣기','',recent);
  if(activeChip){
    const s=SHELVES.find(s=>s.key===activeChip);
    html += row(s.label,`${P.filter(s.test).length}명`,P.filter(s.test));
  }
  Object.keys(ERAS).forEach((era,i)=>{
    const list=P.filter(p=>p.era===era&&(!activeChip||SHELVES.find(s=>s.key===activeChip).test(p)));
    html += row(era,ERAS[era][2],list);
    if(!activeChip && i===3) html += row(SHELVES[0].label,'',P.filter(SHELVES[0].test));
    if(!activeChip && i===6) html += row(SHELVES[3].label,'',P.filter(SHELVES[3].test));
  });
  $('#rows').innerHTML=html;
}
function renderChips(){
  $('#chips').innerHTML = ['전체',...SHELVES.map(s=>s.key)].map(k=>
    `<button class="chip" data-k="${k}" aria-pressed="${(k==='전체'&&!activeChip)||k===activeChip}">${k==='전체'?'전체 100명':esc(k)}</button>`).join('');
}
$('#chips').addEventListener('click',e=>{
  const b=e.target.closest('.chip'); if(!b)return;
  activeChip = b.dataset.k==='전체'?null:b.dataset.k; renderChips(); renderRows();
});

/* ---------- 검색 ---------- */
$('#q').addEventListener('input',e=>{
  const q=e.target.value.trim();
  const res=$('#results');
  if(!q){res.hidden=true;$('#rows').hidden=false;$('#hero').hidden=false;return}
  const list=P.filter(p=>[p.name,p.role,p.era,p.copy,...p.themes].join(' ').includes(q)||String(p.n)===q);
  $('#rows').hidden=true;$('#hero').hidden=true;res.hidden=false;
  res.innerHTML=`<div class="row"><h2>“${esc(q)}” 검색 결과 <small>${list.length}명</small></h2></div>`+
    (list.length?`<div class="grid">${list.map(card).join('')}</div>`:`<div class="empty">찾는 인물이 없어요. 이름이나 ‘의병’, ‘여성’, ‘실학’ 같은 주제로 찾아보세요.</div>`);
});

/* ---------- 카드 클릭 → 상세 ---------- */
document.addEventListener('click',e=>{
  const c=e.target.closest('.card'); if(c) openSheet(+c.dataset.n);
});
function openSheet(n){
  const p=P[n-1]; const [c1,c2]=colors(p); const r=pos[n];
  const same=P.filter(x=>x.era===p.era&&x.n!==n);
  const pairs=(PAIRS[n]||[]).map(i=>P[i-1]);
  const theme=P.filter(x=>x.n!==n&&x.themes.some(t=>p.themes.includes(t))&&x.era!==p.era).slice(0,8);
  const s=$('#sheet');
  s.innerHTML=`<div class="sheet-top gutter" style="--c1:${c1};--c2:${c2}">
      <div class="hanja" aria-hidden="true">${esc(firstChar(p))}</div>
      <button class="close" id="closeSheet" aria-label="닫기">×</button>
      <div class="eyebrow">조선왕조 인물 100선 · ${String(n).padStart(3,'0')}</div>
      <h3>${esc(p.name)}</h3>
      <div class="meta"><span class="tag">${esc(p.era)}</span><span class="tag">${esc(p.role)}</span>${p.themes.map(t=>`<span class="tag">#${esc(t)}</span>`).join('')}</div>
    </div>
    <div class="gutter">
      <p class="copy">${esc(p.copy)}</p>
      <div class="actions">
        <button class="btn primary" id="sheetPlay"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4l14 8-14 8z"/></svg>${r&&r.t>5&&!r.done?`이어 듣기 (${fmt(r.t)})`:'처음부터 듣기'}</button>
        ${r&&r.t>5?`<button class="btn ghost" id="sheetRestart">처음부터</button>`:''}
      </div>
      ${pairs.length?`<div class="sec"><h4>함께 들으면 좋은 인물 · 대비와 논쟁</h4><div class="pair">${pairs.map(card).join('')}</div></div>`:''}
      <div class="sec"><h4>같은 시대 · ${esc(p.era)}</h4><div class="pair">${same.map(card).join('')}</div></div>
      ${theme.length?`<div class="sec"><h4>같은 주제, 다른 시대</h4><div class="pair">${theme.map(card).join('')}</div></div>`:''}
    </div>`;
  s.scrollTop=0;
  $('#sheetBg').classList.add('on'); s.classList.add('on');
  $('#closeSheet').onclick=closeSheet;
  $('#sheetPlay').onclick=()=>{play(n);closeSheet()};
  const rs=$('#sheetRestart'); if(rs) rs.onclick=()=>{pos[n]={t:0,d:(pos[n]||{}).d};store.set('jsn_pos',pos);play(n);closeSheet()};
}
function closeSheet(){$('#sheet').classList.remove('on');$('#sheetBg').classList.remove('on')}
$('#sheetBg').onclick=closeSheet;
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});

/* ---------- 플레이어 ---------- */
const audio=$('#audio'); let cur=null, triedDrive=false;
const SPEEDS=[1,1.25,1.5,1.75,2,0.8]; let sp=store.get('jsn_speed',0);
const ICON_PLAY='<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4l13 8-13 8z"/></svg>';
const ICON_PAUSE='<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>';
$('#playBtn').innerHTML=ICON_PLAY;
$('#speedBtn').textContent=SPEEDS[sp].toFixed(SPEEDS[sp]%1?2:1).replace(/0$/,'')+'×';

function play(n){
  const p=P[n-1]; const [c1,c2]=colors(p);
  if(cur&&cur.n===n){audio.paused?audio.play():null;return}
  savePos(); cur=p; triedDrive=false;
  $('#player').classList.add('on');
  const th=$('#plThumb'); th.style.setProperty('--c1',c1); th.style.setProperty('--c2',c2); th.textContent=firstChar(p);
  $('#plName').textContent=`${p.name} · ${p.role}`;
  $('#status').textContent='불러오는 중…';
  audio.src=R2+n+'_ko'; audio.playbackRate=SPEEDS[sp];
  const r=pos[n]; const startAt=r&&r.t>5&&!r.done?r.t:0;
  audio.addEventListener('loadedmetadata',function once(){audio.removeEventListener('loadedmetadata',once); if(startAt&&startAt<audio.duration-3)audio.currentTime=startAt;});
  audio.play().catch(()=>{$('#status').textContent='재생 버튼을 눌러 주세요.'});
  const rec=store.get('jsn_recent',[]).filter(x=>x!==n); rec.unshift(n); store.set('jsn_recent',rec.slice(0,20));
  if('mediaSession' in navigator){
    navigator.mediaSession.metadata=new MediaMetadata({title:p.name,artist:p.role,album:'조선 100인 · '+p.era});
  }
}
audio.addEventListener('error',()=>{
  if(!cur) return;
  if(!triedDrive){triedDrive=true;$('#status').textContent='예비 경로로 다시 시도하는 중…';
    audio.src='https://drive.google.com/uc?export=download&id='+cur.id; audio.play().catch(()=>{});}
  else $('#status').textContent='오디오를 불러오지 못했어요. 잠시 뒤 다시 눌러 주세요.';
});
audio.addEventListener('playing',()=>{$('#status').textContent='';$('#playBtn').innerHTML=ICON_PAUSE;$('#playBtn').setAttribute('aria-label','일시정지')});
audio.addEventListener('pause',()=>{$('#playBtn').innerHTML=ICON_PLAY;$('#playBtn').setAttribute('aria-label','재생');savePos()});
audio.addEventListener('waiting',()=>{$('#status').textContent='버퍼링 중…'});
let lastSave=0;
audio.addEventListener('timeupdate',()=>{
  const d=audio.duration||0,t=audio.currentTime;
  $('#plTime').textContent=`${fmt(t)} / ${fmt(d)}`;
  $('#fill').style.width=(d?t/d*100:0)+'%';
  if(audio.buffered.length&&d) $('#buf').style.width=(audio.buffered.end(audio.buffered.length-1)/d*100)+'%';
  if(Date.now()-lastSave>5000){lastSave=Date.now();savePos()}
});
audio.addEventListener('ended',()=>{
  if(cur){pos[cur.n]={t:0,d:audio.duration,done:true};store.set('jsn_pos',pos)}
  next();
});
function savePos(){
  if(!cur||!audio.duration||audio.currentTime<5) return;
  pos[cur.n]={t:audio.currentTime,d:audio.duration}; store.set('jsn_pos',pos);
}
function next(){ if(cur) play(cur.n%P.length+1) }
$('#playBtn').onclick=()=>{ if(!cur)return; audio.paused?audio.play():audio.pause() };
$('#back15').onclick=()=>{audio.currentTime=Math.max(0,audio.currentTime-15)};
$('#fwd15').onclick=()=>{audio.currentTime=Math.min(audio.duration||0,audio.currentTime+15)};
$('#nextBtn').onclick=next;
$('#speedBtn').onclick=()=>{sp=(sp+1)%SPEEDS.length;audio.playbackRate=SPEEDS[sp];store.set('jsn_speed',sp);
  $('#speedBtn').textContent=(Math.round(SPEEDS[sp]*100)/100)+'×'};
$('#speedBtn').textContent=(Math.round(SPEEDS[sp]*100)/100)+'×';
// 진행 막대 드래그
(function(){
  const bar=$('#bar'); let drag=false;
  const seek=e=>{const r=bar.getBoundingClientRect();const x=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width));if(audio.duration)audio.currentTime=x*audio.duration};
  bar.addEventListener('pointerdown',e=>{drag=true;bar.setPointerCapture(e.pointerId);seek(e)});
  bar.addEventListener('pointermove',e=>{if(drag)seek(e)});
  bar.addEventListener('pointerup',()=>{drag=false});
})();
if('mediaSession' in navigator){
  navigator.mediaSession.setActionHandler('play',()=>audio.play());
  navigator.mediaSession.setActionHandler('pause',()=>audio.pause());
  navigator.mediaSession.setActionHandler('seekbackward',()=>{audio.currentTime-=15});
  navigator.mediaSession.setActionHandler('seekforward',()=>{audio.currentTime+=15});
  navigator.mediaSession.setActionHandler('nexttrack',next);
}
window.addEventListener('pagehide',savePos);
document.addEventListener('visibilitychange',()=>{if(document.hidden)savePos()});

renderHero(); renderChips(); renderRows();
</script>
</body>
</html>
