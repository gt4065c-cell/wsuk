<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>시안 · AI Agent 실무역량 연습 (트랙 B v0.3)</title>
<!-- 글꼴: Pretendard (무료, SIL OFL). 인터넷이 없으면 휴대폰 기본 글꼴로 자동 대체됩니다. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* =========================================================
   0. 시안 보기 도구 (실제 앱에는 넣지 않음)
   ========================================================= */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0}
body{
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  background:#D6D9E1;color:#151A2D;
}
.toolbar{
  position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;gap:8px;align-items:center;
  padding:8px 12px;background:#1E2233;color:#E6E8F2;font-size:14px;
}
.toolbar .tb-title{font-weight:700;margin-right:4px;white-space:nowrap}
.tb-group{display:flex;border:1px solid #4A5070;border-radius:10px;overflow:hidden}
.tb-group button{
  min-height:44px;padding:0 12px;border:0;background:transparent;color:#D3D7E8;
  font:inherit;font-weight:600;cursor:pointer;white-space:nowrap;
}
.tb-group button+button{border-left:1px solid #4A5070}
.tb-group button[aria-pressed="true"]{background:#FFFFFF;color:#1E2233}
.toolbar select{
  min-height:44px;max-width:100%;padding:0 10px;border-radius:10px;border:1px solid #4A5070;
  background:#2A2F45;color:#FFFFFF;font:inherit;
}
.stage{display:flex;justify-content:center;padding:24px 12px 40px}
.phone{
  --phone-w:390px;
  width:calc(var(--phone-w) + 20px);max-width:100%;height:844px;max-height:calc(100vh - 110px);min-height:560px;
  border:10px solid #121318;border-radius:40px;overflow:hidden;background:var(--bg);
  box-shadow:0 20px 60px rgba(0,0,0,.25);container-type:inline-size;position:relative;
}
.phone[data-w="360"]{--phone-w:360px}
.scroll{height:100%;overflow-y:auto;overflow-x:hidden;background:var(--bg);display:flex;flex-direction:column}
#app{flex:1 0 auto;display:flex;flex-direction:column}
#app>.screen{flex:1 0 auto}
@media (max-width:520px){
  .toolbar{position:static}
  .stage{padding:0}
  .phone{width:100%;height:auto;max-height:none;min-height:0;border:0;border-radius:0;box-shadow:none}
  .scroll{height:auto;overflow:visible;min-height:100vh}
}

/* =========================================================
   1. 색 (디자인시스템.md 1장과 같은 값)
   ========================================================= */
.phone[data-plan="a"][data-mode="light"]{
  --bg:#F4F6FB;--surface:#FFFFFF;--surface-2:#EEF1F8;--text:#151A2D;--text-2:#4A5170;--border:#D5DAE7;
  --primary:#3445C4;--on-primary:#FFFFFF;--primary-weak:#E6E9FC;--accent:#3445C4;
  --correct:#0A7A5A;--correct-bg:#E1F4EC;--wrong:#B4380F;--wrong-bg:#FBE8E0;--note:#7A5300;--note-bg:#FFF3D1;
  --shadow:0 1px 2px rgba(21,26,45,.06),0 4px 16px rgba(21,26,45,.06);
}
.phone[data-plan="a"][data-mode="dark"]{
  --bg:#0E1222;--surface:#181D33;--surface-2:#212742;--text:#ECEEF7;--text-2:#A9B0CC;--border:#323A5C;
  --primary:#8E9BFF;--on-primary:#10142A;--primary-weak:#28305C;--accent:#8E9BFF;
  --correct:#55D6A8;--correct-bg:#123A2E;--wrong:#FF9470;--wrong-bg:#43231A;--note:#F5C66B;--note-bg:#3A2F12;
  --shadow:none;
}
.phone[data-plan="b"][data-mode="light"]{
  --bg:#F7F5EF;--surface:#FFFFFF;--surface-2:#EFECE3;--text:#1B1A17;--text-2:#55524A;--border:#DAD6CA;
  --primary:#1B1A17;--on-primary:#FFFFFF;--primary-weak:#F6E7C8;--accent:#A35A00;
  --correct:#0A7A5A;--correct-bg:#E1F4EC;--wrong:#B4380F;--wrong-bg:#FBE8E0;--note:#7A5300;--note-bg:#FFF3D1;
  --shadow:none;
}
.phone[data-plan="b"][data-mode="dark"]{
  --bg:#111113;--surface:#1C1C20;--surface-2:#26262B;--text:#F4F3EE;--text-2:#B4B2AA;--border:#38383F;
  --primary:#F2B33D;--on-primary:#1B1A17;--primary-weak:#3A2F17;--accent:#F2B33D;
  --correct:#5EDAA9;--correct-bg:#12362B;--wrong:#FF9470;--wrong-bg:#41231A;--note:#F5C66B;--note-bg:#3A2F12;
  --shadow:none;
}
.phone[data-plan="a"]{--r-card:16px;--r-btn:14px;--r-choice:14px;--r-badge:50%}
.phone[data-plan="b"]{--r-card:8px;--r-btn:6px;--r-choice:6px;--r-badge:5px}
.phone{--pad:20px;--mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
@container (max-width:374px){ .screen{--pad:16px} }

/* =========================================================
   2. 앱 공통
   ========================================================= */
.screen{
  min-height:100%;display:flex;flex-direction:column;background:var(--bg);color:var(--text);
  font-size:1.0625rem;line-height:1.6;word-break:keep-all;overflow-wrap:anywhere;
}
.content{flex:1;padding:20px var(--pad) 24px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3,p{margin:0}
h1{font-size:1.625rem;line-height:1.35;font-weight:800;letter-spacing:-.01em}
h2{font-size:1.375rem;line-height:1.35;font-weight:700}
h3{font-size:1.0625rem;font-weight:700}
.sub{color:var(--text-2);font-size:.9375rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);padding:16px;box-shadow:var(--shadow)}
.mono{font-family:var(--mono);letter-spacing:.04em}
.tag{
  display:inline-flex;align-items:center;min-height:28px;padding:0 8px;border:1px solid var(--border);
  border-radius:6px;font-family:var(--mono);font-size:.875rem;font-weight:600;color:var(--text-2);background:var(--surface-2);
}
.h-label{font-size:.9375rem;font-weight:700;color:var(--text-2)}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
svg{flex:none}

/* 버튼 */
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;padding:12px 16px;
  border-radius:var(--r-btn);border:1.5px solid transparent;font:inherit;font-size:1.0625rem;font-weight:700;
  line-height:1.35;cursor:pointer;text-align:center;transition:transform .1s;
}
.btn-primary{background:var(--primary);color:var(--on-primary)}
.btn-secondary{background:var(--surface);color:var(--text);border-color:var(--border)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:active:not(:disabled){transform:scale(.98)}
.btn-col{display:flex;flex-direction:column;gap:10px}
.linkbtn{
  align-self:center;min-height:44px;padding:0 12px;border:0;background:none;color:var(--text-2);
  font:inherit;font-size:.9375rem;font-weight:600;text-decoration:underline;text-underline-offset:3px;cursor:pointer;
}
.bottombar{
  position:sticky;bottom:0;z-index:5;padding:12px var(--pad) calc(12px + env(safe-area-inset-bottom));
  background:var(--bg);border-top:1px solid var(--border);display:flex;flex-direction:column;gap:8px;
}
.hint{font-size:.875rem;color:var(--text-2);text-align:center}

/* 안내 상자 */
.info{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:calc(var(--r-card) - 4px);background:var(--surface-2);color:var(--text-2);font-size:.9375rem;line-height:1.55}
.info svg{margin-top:2px;color:var(--text-2)}
.note{padding:12px 14px;border-radius:calc(var(--r-card) - 4px);background:var(--note-bg);border-left:4px solid var(--note);font-size:1rem}
.note .note-title{display:flex;align-items:center;gap:6px;font-weight:700;color:var(--note);margin-bottom:4px;font-size:.9375rem}
.storage-note{display:flex;gap:6px;align-items:center;justify-content:center;font-size:.875rem;color:var(--note);text-align:center}

/* 지정 링크 띠 */
.band{
  position:sticky;top:0;z-index:6;display:flex;gap:8px;align-items:center;padding:10px var(--pad);
  background:var(--accent);color:var(--on-primary);font-size:.9375rem;font-weight:700;line-height:1.4;
}
.phone[data-plan="b"][data-mode="light"] .band{color:#FFFFFF}

/* =========================================================
   3. 화면별
   ========================================================= */
/* 첫 화면 */
.brand{display:flex;align-items:center;gap:10px}
.logo{width:40px;height:40px;border-radius:12px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;font-weight:800;font-size:.9375rem;letter-spacing:-.02em}
.phone[data-plan="b"] .logo{border-radius:4px;font-family:var(--mono)}
.brand-sub{font-size:.875rem;color:var(--text-2);font-weight:600;line-height:1.35}
.today{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;list-style:none;margin:0;padding:0}
.today li{display:flex;flex-direction:column;gap:2px;padding:10px 8px;border-radius:10px;background:var(--surface-2);font-size:.875rem;font-weight:600;color:var(--text-2);line-height:1.35}
.today b{font-family:var(--mono);color:var(--accent);font-size:.875rem}
.phone[data-plan="b"] .today li{border-radius:4px}
.field label{display:block;font-weight:700;margin-bottom:8px}
.field input{
  width:100%;min-height:56px;padding:0 16px;border:2px solid var(--border);border-radius:var(--r-btn);
  background:var(--surface);color:var(--text);font-family:var(--mono);font-size:1.375rem;font-weight:700;
  letter-spacing:.14em;text-transform:uppercase;
}
.field input::placeholder{letter-spacing:.04em;font-weight:500;color:var(--text-2);opacity:.8;font-size:1.0625rem;text-transform:none}
.field input:focus{outline:none;border-color:var(--primary)}
.field.err input{border-color:var(--wrong)}
.field .help{margin-top:8px;font-size:.9375rem;color:var(--text-2)}
.field .error{margin-top:8px;display:flex;gap:6px;align-items:flex-start;color:var(--wrong);font-weight:700;font-size:.9375rem}

/* 세트 고르기 */
.setlist{display:flex;flex-direction:column;gap:10px}
.setcard{
  display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;width:100%;min-height:72px;padding:14px 16px;
  border:1.5px solid var(--border);border-radius:var(--r-card);background:var(--surface);color:var(--text);
  font:inherit;text-align:left;cursor:pointer;box-shadow:var(--shadow);position:relative;
}
.setcard[aria-checked="true"]{border:2px solid var(--primary);padding:13.5px 15.5px;background:var(--primary-weak)}
.setcard .partno{font-size:1.625rem;font-weight:800;line-height:1;color:var(--accent);min-width:44px}
.setcard .partno small{font-size:.875rem;font-weight:700;margin-left:1px}
.phone[data-plan="b"] .setcard .partno{font-family:var(--mono)}
.setcard .st-title{font-weight:700;line-height:1.35}
.setcard .st-range{font-size:.9375rem;color:var(--text-2)}
.setcard .st-count{font-size:.9375rem;font-weight:700;color:var(--text-2);text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.setcard .st-check{color:var(--primary);display:flex;align-items:center;gap:2px;font-size:.875rem}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{
  min-height:56px;padding:8px 10px;border:1.5px solid var(--border);border-radius:var(--r-btn);background:var(--surface);
  color:var(--text);font:inherit;font-weight:700;line-height:1.3;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
}
.seg button small{font-size:.875rem;font-weight:500;color:var(--text-2)}
.seg button[aria-checked="true"]{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.seg button[aria-checked="true"] small{color:var(--on-primary);opacity:.9}

/* 문제 */
.qhead{display:flex;flex-direction:column;gap:10px}
.qhead-row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.count{font-size:.9375rem;font-weight:700;color:var(--text-2)}
.count-b{display:none}
.phone[data-plan="b"] .count-a{display:none}
.phone[data-plan="b"] .count-b{display:inline;font-family:var(--mono);font-size:1.25rem;font-weight:800;color:var(--accent)}
.phone[data-plan="b"] .h-label{font-family:var(--mono);letter-spacing:.06em}
.steps{display:flex;gap:4px}
.step{flex:1;min-width:0;height:20px;border-radius:99px;background:var(--surface-2);border:1px solid var(--border);display:grid;place-items:center;color:var(--surface)}
.phone[data-plan="b"] .step{border-radius:3px;height:22px}
.step.now{border:2px solid var(--primary);background:var(--primary-weak)}
.step.ok{background:var(--correct);border-color:var(--correct)}
.step.no{background:var(--wrong);border-color:var(--wrong)}
.step.many svg{display:none}
.qcard{display:flex;flex-direction:column;gap:10px}
.qmeta{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.qtype{font-size:.875rem;color:var(--text-2);font-weight:600}
.qtext{font-size:1.1875rem;font-weight:600;line-height:1.55}
.is-team .tag{font-size:1rem;min-height:32px;color:var(--text);border-color:var(--accent)}
.choices{display:flex;flex-direction:column;gap:10px}
.choice{
  display:flex;align-items:flex-start;gap:12px;width:100%;min-height:56px;padding:14px;
  border:1.5px solid var(--border);border-radius:var(--r-choice);background:var(--surface);color:var(--text);
  font:inherit;font-size:1.0625rem;line-height:1.5;text-align:left;cursor:pointer;transition:transform .1s,background .15s;
}
.choice:active:not([aria-disabled="true"]){transform:scale(.99)}
.choice .num{
  flex:none;width:30px;height:30px;border-radius:var(--r-badge);border:1.5px solid var(--text-2);
  display:grid;place-items:center;font-size:.9375rem;font-weight:800;color:var(--text-2);font-family:var(--mono)
}
.choice .txt{flex:1;min-width:0;padding-top:2px}
.choice .mark{flex:none;display:flex;flex-direction:column;align-items:center;gap:0;font-size:.875rem;font-weight:800;line-height:1.25;text-align:center}
.choice .mark.ok{color:var(--correct)}
.choice .mark.no{color:var(--wrong)}
.choice.selected{background:var(--primary-weak);border:2px solid var(--primary);padding:13.5px}
.choice.selected .num{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.choice.is-correct{background:var(--correct-bg);border:2px solid var(--correct);padding:13.5px}
.choice.is-correct .num{background:var(--correct);border-color:var(--correct);color:var(--surface)}
.choice.is-wrong{background:var(--wrong-bg);border:2px dashed var(--wrong);padding:13.5px}
.choice.is-wrong .num{border-color:var(--wrong);color:var(--wrong)}
.choice.dim{opacity:.55}
.choice[aria-disabled="true"]{cursor:default}
/* OX */
.choices.ox{display:grid;grid-template-columns:1fr 1fr}
.ox .choice{flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:112px;gap:4px;padding:12px 8px}
.ox .choice.selected,.ox .choice.is-correct,.ox .choice.is-wrong{padding:11.5px 7.5px}
.ox .choice .num{width:auto;height:auto;border:0;background:none !important;font-size:2.25rem;line-height:1;color:var(--text);font-family:inherit}
.ox .choice.selected .num{color:var(--primary)}
.ox .choice.is-correct .num{color:var(--correct)}
.ox .choice.is-wrong .num{color:var(--wrong)}
.ox .choice .txt{flex:none;font-size:.9375rem;color:var(--text-2);font-weight:600;padding:0}
.ox .choice .mark{flex-direction:row;gap:4px}

/* 채점·해설 */
.verdict{display:flex;gap:10px;align-items:flex-start;padding:14px 16px;border-radius:var(--r-card);border:1.5px solid;font-weight:700;line-height:1.5}
.verdict.ok{background:var(--correct-bg);border-color:var(--correct);color:var(--correct)}
.verdict.no{background:var(--wrong-bg);border-color:var(--wrong);color:var(--wrong)}
.verdict .v-icon{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:currentColor;flex:none}
.verdict .v-icon svg{color:var(--surface)}
.verdict .v-body b{color:var(--text)}
.explain{display:flex;flex-direction:column;gap:10px}
.explain p{line-height:1.65}
.source{font-size:.9375rem;color:var(--text-2)}
@media (prefers-reduced-motion:no-preference){
  .pop{animation:pop .22s ease-out}
  @keyframes pop{from{transform:scale(.96);opacity:.4}to{transform:none;opacity:1}}
}

/* 결과 */
.score{display:flex;align-items:baseline;gap:8px}
.score b{font-size:3rem;line-height:1;font-weight:800;color:var(--accent)}
.score span{font-size:1.375rem;font-weight:700;color:var(--text-2)}
.phone[data-plan="b"] .score b{font-family:var(--mono)}
.chip{display:inline-flex;align-items:center;min-height:28px;padding:0 10px;border-radius:99px;background:var(--surface-2);font-size:.875rem;font-weight:600;color:var(--text-2)}
.phone[data-plan="b"] .chip{border-radius:4px}
.feet{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px;list-style:none;margin:0;padding:0}
.feet li{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border-radius:10px;border:2px solid;font-size:.875rem;font-weight:700;line-height:1.3}
.phone[data-plan="b"] .feet li{border-radius:4px}
.feet li.ok{background:var(--correct-bg);border-color:var(--correct);color:var(--correct)}
.feet li.no{background:var(--wrong-bg);border-color:var(--wrong);border-style:dashed;color:var(--wrong)}
.feet .f-top{display:flex;align-items:center;gap:4px}
.feet .f-id{font-family:var(--mono);color:var(--text-2);font-weight:600}

/* 다시 보기 */
.rv{display:flex;flex-direction:column;gap:12px}
.rv-row{display:flex;gap:8px;align-items:flex-start;padding:10px 12px;border-radius:calc(var(--r-card) - 6px);border:2px solid}
.rv-row.no{background:var(--wrong-bg);border-color:var(--wrong);border-style:dashed}
.rv-row.ok{background:var(--correct-bg);border-color:var(--correct)}
.rv-row .rv-k{flex:none;display:flex;align-items:center;gap:4px;font-weight:800;font-size:.9375rem;min-width:64px}
.rv-row.no .rv-k{color:var(--wrong)}
.rv-row.ok .rv-k{color:var(--correct)}
.rv-row .rv-v{flex:1;min-width:0}
.empty{padding:24px 16px;text-align:center;color:var(--text-2)}
</style>
</head>
<body>

<!-- 시안 보기 도구: 실제 앱에는 넣지 않습니다 -->
<div class="toolbar" role="region" aria-label="시안 보기 도구">
  <span class="tb-title">시안 도구</span>
  <div class="tb-group" role="group" aria-label="분위기">
    <button type="button" data-tb="plan" data-v="a" aria-pressed="true">A안 연구노트(추천)</button>
    <button type="button" data-tb="plan" data-v="b" aria-pressed="false">B안 야간작전실</button>
  </div>
  <div class="tb-group" role="group" aria-label="밝기">
    <button type="button" data-tb="mode" data-v="light" aria-pressed="true">밝게</button>
    <button type="button" data-tb="mode" data-v="dark" aria-pressed="false">어둡게</button>
  </div>
  <div class="tb-group" role="group" aria-label="화면 폭">
    <button type="button" data-tb="w" data-v="390" aria-pressed="true">390px</button>
    <button type="button" data-tb="w" data-v="360" aria-pressed="false">360px</button>
  </div>
  <label class="sr" for="jump">화면 바로가기</label>
  <select id="jump" aria-label="화면 바로가기">
    <option value="">화면 바로가기…</option>
    <option value="start">① 첫 화면 (코드 입력)</option>
    <option value="start-err">① 첫 화면 — 코드 오류 예시</option>
    <option value="resume">①-b 풀던 연습 이어 풀기</option>
    <option value="sets">② 세트 고르기</option>
    <option value="q-fresh">③ 문제 — 고르기 전</option>
    <option value="q-picked">③ 문제 — 보기 고른 상태</option>
    <option value="q-right">④ 해설 — 정답</option>
    <option value="q-wrong">④ 해설 — 오답 + 헷갈리기 쉬워요</option>
    <option value="q-ox">④ 해설 — OX 문항</option>
    <option value="result">⑤ 결과</option>

  S.team=true; S.missing=ids.length-valid.length;
  S.items=buildItems(valid,false);             /* 지정 링크: 적힌 순서 그대로, 섞지 않음 */
  S.idx=0; S.answers=[]; S.selected=null; S.screen="quiz";
}
function autoAnswer(count, wrongAt){
  for(var i=0;i<count && i<S.items.length;i++){
    var it=S.items[i]; var q=it.q; var orig;
    if(wrongAt.indexOf(i)>=0){ orig=q.common_wrong_index; } else { orig=q.answer_index; }
    S.answers[i]={pickedOrig:orig,pickedPos:it.order.indexOf(orig),correct:orig===q.answer_index};
  }
}

/* ③④ 문제 + 해설 */
function viewQuiz(){
  if(!S.items.length){
    return '<div class="screen">'+band()+'<div class="content"><div class="note"><p class="note-title">'+ic("alert",18)+'이 링크에 풀 수 있는 문항이 없어요</p><p>교수님께 알려 주세요.</p></div>'+
      '<button class="btn btn-secondary" data-act="other-set">연습 세트 고르기</button></div></div>';
  }
  var n=S.items.length, i=S.idx, it=S.items[i], q=it.q;
  var ans=S.answers[i], locked=!!ans, sel=S.selected, ox=q.type==="ox";
  var title=S.team?"팀 연습":setById(S.setId).title;
  var many=n>14;
  var steps=S.items.map(function(_,k){
    var a=S.answers[k], cls="step"+(many?" many":"");
    if(a) return '<span class="'+cls+(a.correct?" ok":" no")+'">'+ic(a.correct?"check":"cross",13)+'</span>';
    if(k===i) return '<span class="'+cls+' now"></span>';
    return '<span class="'+cls+'"></span>';
  }).join("");
  var cp=correctPos(it);
  var choices=it.order.map(function(_,p){
    var cls="choice", mark="";
    if(locked){
      if(p===cp){cls+=" is-correct";mark='<span class="mark ok">'+ic("check",20)+'<span>정답</span>'+(ans.pickedPos===p?'<span>내 답</span>':'')+'</span>';}
      else if(p===ans.pickedPos){cls+=" is-wrong";mark='<span class="mark no">'+ic("cross",20)+'<span>내 답</span></span>';}
      else cls+=" dim";
    } else if(sel===p) cls+=" selected";
    var label=choiceLabel(it,p), text=choiceText(it,p);
    var inner = ox
      ? '<span class="num" aria-hidden="true">'+esc(label)+'</span><span class="txt">'+oxWord(label)+'</span>'
      : '<span class="num" aria-hidden="true">'+(p+1)+'</span><span class="txt">'+esc(text)+'</span>';
    var aria = ox ? label+" "+oxWord(label) : (p+1)+"번 "+text;
    if(locked){ aria += (p===cp?" — 정답":"") + (p===ans.pickedPos?" — 내 답":""); }
    return '<button class="'+cls+'" data-act="select" data-pos="'+p+'" aria-label="'+esc(aria)+'"'+
      (locked?' aria-disabled="true"':' aria-pressed="'+(sel===p)+'"')+'>'+inner+mark+'</button>';
  }).join("");

  var feedback="";
  if(locked){
    var right='<b>'+esc(choiceLabel(it,cp))+' '+esc(ox?oxWord(choiceLabel(it,cp)):choiceText(it,cp))+'</b>';
    var verdict = ans.correct
      ? '<div class="verdict ok pop" id="verdict" tabindex="-1" role="status"><span class="v-icon">'+ic("check",18)+'</span><span class="v-body">정답입니다</span></div>'
      : '<div class="verdict no pop" id="verdict" tabindex="-1" role="status"><span class="v-icon">'+ic("cross",18)+'</span><span class="v-body">아쉬워요, 정답은 '+right+'</span></div>';
    var confuse = (!ans.correct && ans.pickedOrig===q.common_wrong_index)
      ? '<div class="note"><p class="note-title">'+ic("alert",18)+'이렇게 헷갈리기 쉬워요</p><p>'+esc(q.common_wrong_reason)+'</p></div>' : '';
    feedback = verdict +
      '<section class="card explain" aria-label="해설"><h3>해설</h3><p>'+esc(q.explanation)+'</p>'+confuse+
      '<p class="source">근거: '+esc(q.source_section)+'</p></section>';
  }
  var missing = (S.team && S.missing>0 && i===0 && !locked)
    ? '<div class="note"><p class="note-title">'+ic("alert",18)+'이 링크에 없는 문항이 '+S.missing+'개 있어요</p><p>있는 문항만 진행해요. 교수님께 알려 주세요.</p></div>' : '';
  var last=i===n-1;
  var bar = locked
    ? '<button class="btn btn-primary" data-act="next">'+(last?'결과 보기':'다음 문제')+'</button>'
    : '<p class="hint">'+(sel===null?'보기를 먼저 고르세요':'확정하면 바로 채점과 해설이 나와요')+'</p>'+
      '<button class="btn btn-primary" data-act="confirm"'+(sel===null?' disabled':'')+'>답 확정</button>';
  var sub=S.team?"순서 고정":(S.amount==="8"?"8문항 · 무작위":"세트 전체");
  return '<div class="screen'+(S.team?' is-team':'')+'">'+band()+
  '<div class="content">'+
    '<div class="qhead">'+
      '<div class="qhead-row"><span class="h-label">'+esc(title)+' · '+sub+'</span>'+
      '<span class="count"><span class="count-a">'+(i+1)+' / '+n+'</span><span class="count-b">'+pad2(i+1)+'/'+pad2(n)+'</span></span></div>'+
      '<div class="steps" aria-hidden="true">'+steps+'</div>'+
      '<span class="sr">전체 '+n+'문항 중 '+(i+1)+'번째 문항</span>'+
    '</div>'+ missing +
    '<div class="card qcard"><div class="qmeta"><span class="tag" title="문항 표지">'+esc(it.id)+'</span><span class="qtype">'+(ox?'O / X':'4지선다')+'</span></div>'+
      '<p class="qtext">'+esc(q.question)+'</p></div>'+
    '<div class="choices'+(ox?' ox':'')+'" role="group" aria-label="보기">'+choices+'</div>'+
    feedback+
  '</div>'+
  '<div class="bottombar">'+storageNote()+bar+'</div>'+
  '</div>';
}

      '<button class="btn btn-primary" data-act="replay">'+(S.team?'같은 문항 다시 풀기':'다시 풀기 — 새로 섞어요')+'</button>'+

    '</div>'+

/* ⑥ 틀린 문항 다시 보기 */
function viewReview(){
  var list=[];
  S.items.forEach(function(it,k){
    var a=S.answers[k]; if(!a||a.correct) return;
    var q=it.q, ox=q.type==="ox", cp=correctPos(it);
    function show(pos){var l=choiceLabel(it,pos);return esc(l)+' '+esc(ox?oxWord(l):choiceText(it,pos));}
    var confuse=(a.pickedOrig===q.common_wrong_index)?'<div class="note"><p class="note-title">'+ic("alert",18)+'이렇게 헷갈리기 쉬워요</p><p>'+esc(q.common_wrong_reason)+'</p></div>':'';
    list.push('<article class="card rv"><div class="qmeta"><span class="tag">'+esc(it.id)+'</span><span class="qtype">'+(k+1)+'번째 문항</span></div>'+
      '<p class="qtext">'+esc(q.question)+'</p>'+
      '<div class="rv-row no"><span class="rv-k">'+ic("cross",18)+'내 답</span><span class="rv-v">'+show(a.pickedPos)+'</span></div>'+
      '<div class="rv-row ok"><span class="rv-k">'+ic("check",18)+'정답</span><span class="rv-v">'+show(cp)+'</span></div>'+
      '<p>'+esc(q.explanation)+'</p>'+confuse+
      '<p class="source">근거: '+esc(q.source_section)+'</p></article>');
  });
  return '<div class="screen">'+band()+
  '<div class="content">'+
    '<div><p class="h-label">결과 › 다시 보기</p><h2 style="margin-top:2px">틀린 문항 '+list.length+'개</h2></div>'+
    (list.length?list.join(""):'<div class="card empty">틀린 문항이 없어요.</div>')+
  '</div>'+
  '<div class="bottombar"><button class="btn btn-secondary" data-act="back-result">결과로 돌아가기</button></div>'+
  '</div>';
}

/* ========================================================= 그리기 */
var VIEWS={start:viewStart,resume:viewResume,sets:viewSets,quiz:viewQuiz,result:viewResult,review:viewReview};
function render(opts){
  opts=opts||{};
  app.innerHTML=VIEWS[S.screen]();
  if(opts.top){scroller.scrollTop=0; if(window.innerWidth<=520) window.scrollTo(0,0);}
  if(opts.focusVerdict){
    var v=document.getElementById("verdict");
    if(v){v.focus({preventScroll:true});
      var reduce=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      v.scrollIntoView({block:"center",behavior:reduce?"auto":"smooth"});}
  }
  if(opts.focusCode){var c=document.getElementById("code"); if(c) c.focus();}
}
function go(screen){S.screen=screen;render({top:true});}

/* ========================================================= 동작 */
app.addEventListener("input",function(e){ if(e.target.id==="code") S.draft=e.target.value; });
app.addEventListener("submit",function(e){
  e.preventDefault();
  var v=(S.draft||"").trim().toUpperCase();
  /* 영문·숫자 2~10자, '-' 허용(K7M2PX-N), 한글·특수문자·이모지 거절 */
  if(!/^(?=.*[A-Z0-9])[A-Z0-9-]{2,10}$/.test(v)){
    S.codeError="카드에 적힌 영문·숫자 코드를 넣어 주세요 (2~10자).";
    render({focusCode:true}); return;
  }
  S.codeError=""; S.code=v; S.draft=v;
  if(S.team){ startTeam(S.teamIds); render({top:true}); }
  else go("sets");
});
app.addEventListener("click",function(e){
  var b=e.target.closest("[data-act]"); if(!b||!app.contains(b)) return;
  var act=b.getAttribute("data-act");
  switch(act){
    case "home": S.team=false; S.codeError=""; go("start"); break;
    case "new-start": S.codeError=""; go("start"); break;
    case "resume":
      if(!S.code){S.code="K7M2PX";S.draft="K7M2PX";}
      startSet("PRACTICE-P3","all"); autoAnswer(3,[1]); S.idx=3; render({top:true}); break;
    case "pick-set": S.setId=b.getAttribute("data-id"); render(); break;
    case "pick-amount": S.amount=b.getAttribute("data-v"); render(); break;
    case "start-set": startSet(S.setId,S.amount); render({top:true}); break;
    case "select":
      if(S.answers[S.idx]) return;                          /* 확정 후에는 바꿀 수 없음 */
      S.selected=+b.getAttribute("data-pos"); render(); break;
    case "confirm":
      if(S.selected===null||S.answers[S.idx]) return;      /* 연타해도 한 번만 채점 */
      var it=S.items[S.idx], orig=it.order[S.selected];
      S.answers[S.idx]={pickedOrig:orig,pickedPos:S.selected,correct:orig===it.q.answer_index};
      render({focusVerdict:true}); break;
    case "next":
      if(S.busy||!S.answers[S.idx]) return;                /* 연타해도 한 문항만 */
      S.busy=true; setTimeout(function(){S.busy=false;},350);
      S.selected=null;
      if(S.idx>=S.items.length-1){go("result");} else {S.idx++;render({top:true});}
      break;
    case "review": go("review"); break;
    case "back-result": go("result"); break;
    case "replay":
      if(S.team) startTeam(S.teamIds); else startSet(S.setId,S.amount);
      render({top:true}); break;
    case "other-set": S.team=false; go("sets"); break;
  }
});

/* ========================================================= 시안 도구 */
function syncToolbar(){
  document.querySelectorAll("[data-tb]").forEach(function(btn){
    var k=btn.getAttribute("data-tb"), v=btn.getAttribute("data-v");
    var cur = k==="plan"?phone.dataset.plan : k==="mode"?phone.dataset.mode : phone.dataset.w;
    btn.setAttribute("aria-pressed", String(cur===v));
  });
}
document.querySelector(".toolbar").addEventListener("click",function(e){
  var b=e.target.closest("[data-tb]"); if(!b) return;
  var k=b.getAttribute("data-tb"), v=b.getAttribute("data-v");
  if(k==="plan"){ phone.dataset.plan=v; phone.dataset.mode = v==="a"?"light":"dark"; } /* A안 기본 밝게, B안 기본 어둡게 */
  if(k==="mode") phone.dataset.mode=v;
  if(k==="w") phone.dataset.w=v;
  syncToolbar();
});
function ensureCode(){ if(!S.code){S.code="K7M2PX";S.draft="K7M2PX";} }
function firstWithCommonWrongMcq(){
  for(var k=0;k<S.items.length;k++){ if(S.items[k].q.type==="mcq") return k; } return 0;
}
function jump(name){
  S.storageOff=false; S.codeError=""; S.selected=null;
  switch(name){
    case "start": S.team=false; go("start"); break;
    case "start-err": S.team=false; S.draft="김교수"; S.codeError="카드에 적힌 영문·숫자 코드를 넣어 주세요 (2~10자)."; go("start"); break;
    case "resume": ensureCode(); S.team=false; go("resume"); break;
    case "sets": ensureCode(); S.team=false; go("sets"); break;
    case "q-fresh": ensureCode(); startSet("PRACTICE-P3","8"); render({top:true}); break;
    case "q-picked": ensureCode(); startSet("PRACTICE-P3","8");
      S.idx=firstWithCommonWrongMcq(); autoAnswer(S.idx,[]); S.selected=1; render({top:true}); break;
    case "q-right": ensureCode(); startSet("PRACTICE-P3","8");
      var k1=firstWithCommonWrongMcq(); autoAnswer(k1,[]); S.idx=k1;
      var it1=S.items[k1]; S.answers[k1]={pickedOrig:it1.q.answer_index,pickedPos:correctPos(it1),correct:true}; render({top:true}); break;
    case "q-wrong": ensureCode(); startSet("PRACTICE-P3","8");
      var k2=firstWithCommonWrongMcq(); autoAnswer(k2,[]); S.idx=k2;
      var it2=S.items[k2], w=it2.q.common_wrong_index;
      S.answers[k2]={pickedOrig:w,pickedPos:it2.order.indexOf(w),correct:false}; render({top:true}); break;
    case "q-ox": ensureCode(); startSet("PRACTICE-P3","all");
      var k3=0; for(var j=0;j<S.items.length;j++){ if(S.items[j].q.type==="ox"){k3=j;break;} }
      autoAnswer(k3,[]); S.idx=k3; var it3=S.items[k3], w3=it3.q.common_wrong_index;
      S.answers[k3]={pickedOrig:w3,pickedPos:it3.order.indexOf(w3),correct:false}; render({top:true}); break;
    case "result": ensureCode(); startSet("PRACTICE-P3","all"); autoAnswer(S.items.length,[1,4]); go("result"); break;
    case "review": ensureCode(); startSet("PRACTICE-P3","all"); autoAnswer(S.items.length,[1,4]); go("review"); break;
    case "team-start": S.team=true; S.teamIds=TEAM_IDS.slice(); S.items=[]; go("start"); break;
    case "team-q": ensureCode(); S.teamIds=TEAM_IDS.concat(["X99-Q9"]); startTeam(S.teamIds); render({top:true}); break;
    case "team-result": ensureCode(); S.teamIds=TEAM_IDS.slice(); startTeam(S.teamIds); autoAnswer(S.items.length,[2]); go("result"); break;
    case "storage-off": ensureCode(); startSet("PRACTICE-P2","all"); S.storageOff=true; render({top:true}); break;
  }
}
document.getElementById("jump").addEventListener("change",function(e){ if(e.target.value){ jump(e.target.value); e.target.value=""; } });

  if(m){
    var ids=decodeURIComponent(m[1]).split(",").map(function(s){return s.trim().toUpperCase();}).filter(Boolean).slice(0,30);

  }
  syncToolbar(); render();
})();
