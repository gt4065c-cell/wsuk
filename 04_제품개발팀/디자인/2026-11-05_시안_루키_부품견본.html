<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>루키 부품 견본 · 결재2 디자인 시안</title>
<!-- 레벨업 캠퍼스 · UX/UI 디자이너 · 2026-11-05
     파일 하나로 열립니다. 외부 글꼴·그림·주소 요청 없음 (그림은 SVG/CSS/이모지). -->
<style>
:root{--bg:#0B1026;--surface:#18204A;--surface-2:#0F1530;--line:#2E3A7A;--line-2:#3A4686;--text:#EEF2FF;--text-2:#B9C3EA;--ok:#4FE3C1;--bad:#FF8A5B;--gold:#FFD166;--violet:#8B7BFF;--blue:#5AA8FF}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;font-size:16px;line-height:1.45;color:var(--text);background:var(--bg);background-image:radial-gradient(120% 420px at 50% 0%,#1E2A66 0%,rgba(11,16,38,0) 70%);background-repeat:no-repeat;overflow-x:hidden;-webkit-tap-highlight-color:transparent;word-break:keep-all;overflow-wrap:anywhere}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-user-select:none;user-select:none}
button:disabled{cursor:default}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:430px;margin:0 auto;padding:0 16px 32px}

/* 맨 위 */
.top{padding:16px 0 4px}
.top h1{font-size:20px;font-weight:900;line-height:1.3}
.top p{font-size:14px;color:var(--text-2)}
.tabs{position:sticky;top:0;z-index:30;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px 0;background:rgba(11,16,38,.96)}
.tab{min-height:52px;border-radius:14px;background:var(--surface);border:2px solid var(--line);font-weight:800;font-size:15px;line-height:1.2;padding:4px 2px}
.tab[aria-selected="true"]{border-color:var(--gold);background:#2A2F63;color:#fff}
.lead{font-size:14px;color:var(--text-2);margin-top:4px}
h2{font-size:18px;font-weight:900;line-height:1.3}
.card{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:14px;margin-top:12px}
.badge-rec{display:inline-block;background:var(--gold);color:#2A1600;font-size:14px;font-weight:900;padding:0 8px;border-radius:999px;vertical-align:2px}
.badge-cmp{display:inline-block;background:#3A4686;color:#fff;font-size:14px;font-weight:800;padding:0 8px;border-radius:999px;vertical-align:2px}

/* 버튼 */
.btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;min-height:56px;border-radius:14px;font-size:16px;font-weight:800;padding:0 14px;text-align:center}
.btn.primary{background:linear-gradient(135deg,#8B7BFF,#5AA8FF);color:#fff}
.btn.ghost{border:2px solid var(--line-2);background:var(--surface-2)}
.btn:disabled{opacity:.55}
.btn.sm{width:auto;min-height:48px;font-size:14px;padding:0 12px;flex:none}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.sg{min-height:48px;border-radius:12px;border:2px solid var(--line-2);background:var(--surface-2);font-weight:800;font-size:14px;line-height:1.25;padding:4px}
.sg[aria-pressed="true"]{border-color:var(--gold);background:#2A2F63;color:#fff}

/* 부품 고르기 */
.picker{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
.pk{position:relative;min-height:56px;border-radius:12px;background:var(--surface);border:2px solid var(--line);font-size:14px;font-weight:800;line-height:1.2;padding:4px 2px}
.pk b{display:block;font-size:15px;color:var(--gold)}
.pk[aria-pressed="true"]{border-color:var(--gold);background:#2A2F63}
.pk.dn::after{content:"✓";position:absolute;top:1px;right:5px;color:var(--ok);font-size:14px;font-weight:900}
.phead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:14px}
.pname{font-size:17px;font-weight:900;line-height:1.3}
.pname code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;color:var(--text-2);font-weight:600}
.pwhen{font-size:14px;color:var(--text-2)}

/* 게임 화면 틀 */
.scr{position:relative;background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:10px;margin-top:10px}
.mh{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-size:14px}
.tagv{background:var(--violet);color:#fff;font-weight:800;font-size:14px;padding:1px 9px;border-radius:999px;white-space:nowrap}
.mt{font-size:15px;font-weight:800}
.cc{margin-left:auto;color:var(--ok);font-weight:800;font-size:14px}
.combo{background:var(--gold);color:#2A1600;font-weight:900;font-size:14px;padding:0 8px;border-radius:999px}
.stage{display:flex;flex-direction:column;align-items:center;margin-top:6px}
.rkbox{width:64px}
.bubble{position:relative;width:100%;background:var(--surface-2);border:2px solid var(--line-2);border-radius:16px;padding:14px 10px 8px;margin-top:8px}
.bubble::before{content:"";position:absolute;top:-9px;left:50%;margin-left:-8px;border:8px solid transparent;border-top:0;border-bottom:9px solid var(--line-2)}
.bubble .who{position:absolute;top:-12px;left:10px;background:#000;color:#fff;font-size:14px;font-weight:800;padding:0 8px;border-radius:8px;line-height:1.5}
.bubble p{font-size:17px;font-weight:800;line-height:1.45;min-height:50px}
.panel{margin-top:12px}
.acts{margin-top:12px;display:grid;gap:8px}
.acts:empty{display:none}
.prompt{color:var(--gold);font-weight:800;font-size:16px;margin-bottom:8px}
.tip{font-size:14px;color:var(--text-2);margin-top:8px}
.ml{display:block;font-size:14px;color:var(--text-2);font-weight:800}
.rec{margin-top:12px;padding-top:10px;border-top:2px dashed var(--line);font-size:14px;color:var(--text-2)}
.rec b{color:var(--text)}
.steps{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.steps span{padding:0 8px;border-radius:999px;border:2px solid var(--line-2);font-size:14px}
.steps span.on{border-color:var(--gold);color:var(--gold);font-weight:800}
.xp{position:absolute;z-index:6;width:84px;text-align:center;font-weight:900;font-size:16px;color:var(--gold);pointer-events:none;animation:xpup 1.1s forwards;text-shadow:0 2px 6px #000}
.cardget{display:grid;gap:2px;padding:12px 14px;border-radius:16px;background:linear-gradient(135deg,#B7AEFF,#7FF0D6);color:#0B1026}
.cardget .cg-t{font-size:14px;font-weight:900}
.cardget b{font-size:20px;font-weight:900}
.cardget .cg-s{font-size:14px;font-weight:700}

/* 공통 조각 */
.dcard,.gcard{display:flex;align-items:center;gap:8px;width:100%;min-height:52px;padding:8px 12px;border-radius:12px;background:#222B5E;border:2px solid var(--line-2);font-size:16px;font-weight:700;text-align:left;touch-action:none}
.hd{color:var(--text-2);font-size:18px;line-height:1}
.chip{min-height:48px;padding:6px 14px;border-radius:999px;background:#2A2F63;border:2px solid var(--line-2);font-weight:800;font-size:16px;touch-action:none}
.chip.used{opacity:.35}
.sel{border-color:var(--gold)!important;box-shadow:0 0 0 3px rgba(255,209,102,.35)}
.okb{border-color:var(--ok)!important;background:#0F3A40!important}
.badb{border-color:var(--bad)!important}
.wrong{opacity:.65;border-color:var(--bad)!important}
.over{border-color:var(--ok)!important;background:#123B44!important;transform:scale(1.04)}
.hint{outline:3px dashed var(--gold)!important;outline-offset:3px;animation:blinkt .5s 2}
.lift{opacity:.35}
.ghost{position:fixed!important;z-index:1000;pointer-events:none;transform:scale(1.04);box-shadow:0 14px 30px rgba(0,0,0,.55);margin:0}
.suck{animation:suck .35s forwards}
.opts{display:grid;gap:8px}
.opt{display:flex;align-items:center;gap:10px;width:100%;min-height:56px;padding:8px 12px;border-radius:14px;background:#222B5E;border:2px solid var(--line-2);font-size:16px;font-weight:700;text-align:left}
.opt .ot2{flex:1}
.mk{flex:none;font-weight:900;font-size:15px}
.mk:empty{display:none}
.okb .mk{color:var(--ok)}
.wrong .mk,.badb .mk{color:var(--bad)}
.log{background:#05070F;border:2px solid #222A55;border-radius:12px;padding:10px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;color:#9FF3D9;margin-top:10px;display:grid;gap:4px}

/* 1 분류 */
.bins{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bin{min-height:96px;border:2px dashed var(--blue);border-radius:14px;background:var(--surface-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 2px;transition:transform .15s}
.bin .bi{font-size:22px;line-height:1.2}
.bin b{font-size:15px}
.bin .bc{font-size:14px;color:var(--text-2)}
.tray{display:grid;gap:8px;margin-top:10px}
/* 2 짝 */
.mgrid{display:grid;grid-template-columns:2fr 3fr;grid-auto-rows:minmax(64px,auto);gap:8px}
.mi{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:12px;background:#222B5E;border:2px solid var(--line-2);font-size:15px;font-weight:700;text-align:left}
.mn{flex:none;background:var(--ok);color:#06302A;font-size:14px;font-weight:900;border-radius:999px;padding:0 7px}
.mn:empty{display:none}
/* 3 순서 */
.olist{list-style:none;display:grid;gap:8px}
.orow{display:flex;align-items:center;gap:8px;min-height:60px;padding:6px;border-radius:12px;background:#222B5E;border:2px solid var(--line-2)}
.onum{flex:none;width:28px;height:28px;border-radius:50%;background:var(--violet);display:grid;place-items:center;font-weight:900;font-size:14px}
.otx{flex:1;min-width:0;display:flex;flex-direction:column}
.otx b{font-size:16px}
.otx small{font-size:14px;color:var(--text-2);line-height:1.3}
.okb .mk{color:var(--ok)}
.oud{display:flex;gap:6px;flex:none}
.ud{width:44px;height:44px;border-radius:10px;background:var(--surface-2);border:2px solid var(--line-2);font-size:16px}
.ud:disabled{opacity:.3}
/* 4 틀린 곳 */
.memo{background:#FFF4CF;color:#3A2A00;border-radius:12px;padding:10px 12px;font-size:15px;font-weight:600}
.memo .ml{color:#6E5000}
.draft{margin-top:10px;background:var(--surface-2);border:2px solid var(--line-2);border-radius:12px;padding:10px}
.dl{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 8px;font-size:14px;color:var(--text-2);font-weight:800}
.cnt.okc{color:var(--ok)}
.sline{display:block;width:100%;text-align:left;min-height:48px;padding:10px;border-radius:10px;border:2px solid transparent;font-size:15.5px;background:#1A2252;margin-top:6px}
.sline.struck{border-color:var(--bad)}
.sline.struck .st{text-decoration:line-through}
.sline .sm{display:block;color:var(--bad);font-weight:900;font-size:14px}
.sline .sm:empty{display:none}
/* 5 고르기 */
.rules{background:var(--surface-2);border:2px solid var(--line-2);border-radius:12px;padding:8px 10px;font-size:15px;font-weight:700}
.inbox{list-style:none;display:grid;gap:6px;margin:8px 0 12px}
.inbox li{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:4px 8px;background:#1A2252;border-radius:10px;padding:8px 10px;font-size:15px}
.tg{font-size:14px;font-weight:800;padding:0 8px;border-radius:999px;border:2px solid currentColor}
.tg.ok{color:var(--ok)}.tg.q{color:var(--gold)}
.abcd{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--line-2);display:grid;place-items:center;font-weight:900;font-size:15px}
.eh{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-size:14px;color:var(--text-2)}
.eq{font-size:19px;font-weight:800;margin:8px 0 10px;line-height:1.4}
.exp{border:2px solid var(--ok);background:#0F3A40;border-radius:12px;padding:10px;font-size:15px;margin-top:10px}
.exp.no{border-color:var(--bad);background:#3A2216}
.warn{border:2px solid var(--gold);background:#3A3216;border-radius:12px;padding:10px;font-size:15px;margin-top:8px}
.score{font-size:14px;color:var(--text-2);margin-top:8px}
/* 6 빈칸 */
.doc{background:var(--surface-2);border:2px solid var(--line-2);border-radius:12px;padding:10px;display:grid;gap:8px}
.fl{display:flex;align-items:center;gap:8px;font-size:15.5px}
.blank,.given{flex:none;width:104px;min-height:48px;border-radius:10px;font-weight:800;font-size:15px;line-height:1.2;padding:2px 4px}
.blank{border:2px dashed var(--blue);background:#141B45;color:var(--text-2)}
.blank.act{border-color:var(--gold);color:var(--gold);box-shadow:0 0 0 3px rgba(255,209,102,.25)}
.blank.filled{border-style:solid;color:var(--text)}
.given{display:grid;place-items:center;background:#222B5E;border:2px solid var(--line-2)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
/* 7 대화 */
.ctx2{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center}
.mini{background:var(--surface-2);border:2px solid var(--line-2);border-radius:12px;padding:8px;font-size:15px;font-weight:700}
.mini small{display:block;font-size:14px;color:var(--text-2);font-weight:600}
.arrow{color:var(--gold);font-weight:900;font-size:18px}
.ans{display:flex;align-items:center;gap:10px;width:100%;min-height:56px;padding:8px 12px;border-radius:14px;border:2px solid var(--blue);background:var(--surface-2);font-size:16px;font-weight:700}
.boss{flex:none;background:var(--blue);color:#06142E;font-size:14px;font-weight:900;padding:0 8px;border-radius:8px}
.ans .at{flex:1;text-align:right}
/* 8 넘기기 */
.dots{display:flex;justify-content:center;gap:8px;font-size:16px;color:var(--text-2);margin-bottom:8px}
.dt.qz{color:var(--violet)}
.dt.cur{color:var(--gold);transform:scale(1.35)}
.swc{touch-action:pan-y}
.swcard{background:linear-gradient(160deg,#25307A,#18204A);border:2px solid var(--line-2);border-radius:18px;padding:14px;min-height:236px;text-align:center}
.swcard .art svg{width:96px;height:auto}
.swcard .big{font-size:30px;font-weight:900;color:var(--gold);line-height:1.2}
.swcard .swt{font-size:18px;font-weight:800}
.swcard .sws{font-size:16px;color:var(--text-2);margin-top:4px}
.swcard .pg{font-size:14px;color:var(--text-2);margin-top:8px}
.swcard.quiz{text-align:left}
.qbadge{display:inline-block;font-size:14px;font-weight:800;color:var(--gold);margin-bottom:6px}
.swn{display:grid;grid-template-columns:1fr 2fr;gap:8px;margin-top:10px}
.swn .btn{font-size:15px}
/* 9 건네기 */
.task{font-size:15px;font-weight:700;background:var(--surface-2);border-radius:12px;padding:8px 10px;border:2px solid var(--line-2)}
.dz{display:flex;align-items:center;gap:10px;width:100%;margin:10px 0;padding:8px 10px;border:2px dashed var(--blue);border-radius:14px;background:#141B45;text-align:left;min-height:84px;transition:transform .15s}
.dzr{flex:none;width:56px}
.dzt{font-size:15px;font-weight:800}
.dzt small{display:block;font-size:14px;color:var(--text-2);font-weight:600}
.gitems{display:grid;gap:8px}
.gcard .gi{font-size:22px;flex:none}
.gcard .gt{display:flex;flex-direction:column}
.gcard small{font-size:14px;color:var(--text-2);font-weight:600}
/* 10 만들기 */
.bboard{background:var(--surface-2);border:2px solid var(--line-2);border-radius:12px;padding:10px;display:grid;gap:8px}
.brow{display:grid;grid-template-columns:72px 1fr;gap:8px;align-items:center}
.bl{font-size:14px;font-weight:800;color:var(--text-2)}
.slot{min-height:52px;border:2px dashed var(--blue);border-radius:10px;background:#141B45;font-size:15px;font-weight:700;padding:4px 10px;text-align:left;color:var(--text-2);transition:transform .15s}
.slot.filled{border-style:solid;border-color:var(--ok);color:var(--text);background:#0F3A40}
.result{margin-top:10px;border:2px solid var(--gold);border-radius:16px;padding:12px;background:#221E3A;font-size:15px}
.result b{display:block;color:var(--gold);font-size:14px}

/* 2탭 루키 */
.player{display:flex;flex-direction:column;align-items:center;margin:10px 0 4px}
.pbig{width:120px;animation:float 3s ease-in-out infinite}
.pcap{font-size:15px;font-weight:800;text-align:center;margin-top:6px}
.ctl-l{font-size:14px;color:var(--text-2);font-weight:800;margin:10px 0 6px}
.sbtns,.mbtns{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.sb,.mb{min-height:52px;border-radius:12px;border:2px solid var(--line-2);background:var(--surface-2);font-size:14px;font-weight:800;line-height:1.2;padding:2px}
.sb b{display:block;color:var(--gold);font-size:15px}
.sb[aria-pressed="true"],.mb[aria-pressed="true"]{border-color:var(--gold);background:#2A2F63}
.grow-row{border-top:2px dashed var(--line);padding:10px 0 4px;margin-top:8px}
.gr-h{display:flex;flex-wrap:wrap;align-items:center;gap:2px 8px;font-size:15px}
.gr-h .dc{color:var(--text-2);font-size:14px}
.sw{width:18px;height:18px;border-radius:5px;flex:none;border:2px solid rgba(255,255,255,.3)}
.gr-w{font-size:14px;color:var(--text-2)}
.gr-c{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}
.cell{display:flex;flex-direction:column;align-items:center;background:var(--surface-2);border-radius:12px;padding:6px 2px 4px}
.cm{width:100%;max-width:64px}
.cell span{font-size:14px;color:var(--text-2)}
.note{font-size:14px;color:var(--text-2);margin-top:10px}
.cmpc{border:2px solid var(--line-2);border-radius:14px;padding:10px;margin-top:10px}
.cmph{font-weight:900;font-size:15px}
.pair{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:6px}
.pair>div{display:flex;flex-direction:column;align-items:center;width:96px}
.pair .cm{max-width:80px}
.pair span{font-size:14px;color:var(--text-2)}
.arr{font-size:20px;color:var(--gold);font-weight:900}
.cmpc ul{list-style:none;font-size:14px;margin-top:6px;display:grid;gap:2px}

/* 3탭 지도 */
.mapctl{display:grid;gap:6px;margin-top:10px}
.mapsum{font-size:14px;color:var(--text-2);margin-top:8px}
.bld{margin-top:12px}
.bsign{background:var(--gold);color:#2A1600;text-align:center;font-weight:900;font-size:15px;padding:6px;border-radius:12px 12px 0 0}
.roof{height:30px;background:#2A2F63;clip-path:polygon(0 100%,8% 0,92% 0,100% 100%)}
.floors{border:2px solid var(--line-2);border-top:0;background:#141B45}
.floor{padding:10px 6px 10px;border-top:2px solid var(--line-2)}
.floor:first-child{border-top:0}
.floor.open{background:linear-gradient(180deg,#232C6A,#1A2356)}
.floor.locked{background:#0F1430}
.fsign{display:flex;flex-wrap:wrap;align-items:center;gap:2px 8px;font-size:14px;margin-bottom:22px}
.fno{background:var(--violet);color:#fff;font-weight:900;padding:0 8px;border-radius:8px}
.locked .fno{background:#3A4686}
.fnm{flex:1;min-width:0;font-weight:700}
.frg{color:var(--text-2)}
.locked .fnm{color:#A3ACD6}
.rooms{display:flex;flex-wrap:wrap-reverse;justify-content:center;gap:26px 6px}
.rooms.rev{flex-direction:row-reverse}
.rc{width:calc((100% - 24px) / 5);display:flex;flex-direction:column;align-items:center;gap:4px}
.room{position:relative;width:56px;height:56px;border-radius:16px;font-weight:900;font-size:18px;display:grid;place-items:center;border:2px solid var(--line-2)}
.rs{position:absolute;top:-9px;right:-9px;min-width:24px;height:24px;padding:0 3px;border-radius:12px;font-size:14px;display:grid;place-items:center;background:#0B1026;border:2px solid var(--line-2);line-height:1;color:var(--text)}
.st-done{background:var(--gold);color:#2A1600;border-color:#FFE2A0}
.st-done .rs{color:var(--ok);border-color:var(--ok)}
.st-rev{background:#D9B35A;color:#2A1600;border-color:#FFE2A0}
.st-rev .rs{color:var(--gold);border-color:var(--gold)}
.st-lock{background:#1B2350;color:#8F99C8}

/* 끌기 + 누르고-누르기 (모든 끌기 부품 공통) */
function zoneAt(c,x,y,sel){
 var els=document.elementsFromPoint?document.elementsFromPoint(x,y):[document.elementFromPoint(x,y)];
 for(var i=0;i<els.length;i++){var z=els[i]&&els[i].closest&&els[i].closest(sel);if(z&&c.scr.contains(z))return z;}
 return null;
}
function draggable(c,el,o){

  if(el.disabled||c.busy||c.dead)return;

  try{el.setPointerCapture(e.pointerId);}catch(_){}
 });

  if(!st||st.id!==e.pointerId)return;

   if(Math.sqrt(dx*dx+dy*dy)<=8)return;
   st.drag=true;var r=el.getBoundingClientRect();var g=el.cloneNode(true);g.classList.add("ghost");g.classList.remove("sel");
   g.style.width=r.width+"px";g.style.left=r.left+"px";g.style.top=r.top+"px";st.ox=st.x-r.left;st.oy=st.y-r.top;
   document.body.appendChild(g);st.g=g;el.classList.add("lift");c.unsel();
  }
  st.g.style.left=(e.clientX-st.ox)+"px";st.g.style.top=(e.clientY-st.oy)+"px";

  if(z)z.classList.add("over");

 });

 function slotOf(id){return $('.slot[data-id="'+id+'"]',c.panel);}
 function lbl(id){return SL.filter(function(s){return s.id===id;})[0].l;}
 function place(chip,slot,tog){
  var p=pOf(chip);slot.classList.add("filled");slot.textContent=p.t+(tog?"  함께 ✓":"  ✓");slot.setAttribute("aria-label",lbl(slot.dataset.id)+" 칸: "+p.t);

  else c.say((tog?"함께 넣었어요 ✓":"딱 맞아요!")+"|남은 칸 "+(SL.length-nFill)+"개!","happy");
 }

  L.forEach(function(l,k){c.later(function(){var d=document.createElement("div");d.textContent=l;lg.appendChild(d);restart(d,"fly");
   if(k===L.length-1){c.busy=false;
    var r=document.createElement("div");r.className="result";r.innerHTML="<b>★ 루키의 첫 문제</b>Q. AI 연구가 시작된 해는?<br>① 1956년 ✓ &nbsp; ② 1991년";

 });
}

 t.innerHTML=top+legend+body+cta;
 $$(".sg[data-v]",t).forEach(function(b){b.addEventListener("click",function(){mapView=b.dataset.v;renderMap();scrollCur();});});
 $$(".sg[data-s]",t).forEach(function(b){b.addEventListener("click",function(){mapState=b.dataset.s;renderMap();scrollCur();});});
 $$("[data-n]",t).forEach(function(b){b.addEventListener("click",function(){roomInfo(+b.dataset.n);});});
 $(".go",t).addEventListener("click",function(){toast("견본이에요. 앱에선 "+curN+"강 입구로 가요");});
}
function roomInfo(n){
 var s=lst(n),ti=TITLES[n]?" · "+TITLES[n]:"",promo=PROMO.indexOf(n)>=0,msg;
 if(s==="cur")msg=n+"강"+ti+" — ◎ 지금 할 강";
 else if(s==="done")msg=n+"강"+ti+" ✓ "+stars(STARS[n])+" · [다시 하기] [카드 보기]";
 else if(s==="rev")msg=n+"강"+ti+" ↺ 복습 추천 · "+stars(STARS[n]);
 else msg=n+"강 🔒 앞 강을 깨면 열려요";
 if(promo&&s!=="done")msg+=" · 승진 강";
 if(FRIENDS[n]&&mapState!=="start")msg+=" · 친구 "+FRIENDS[n].map(function(f){return f.n+" Lv."+f.lv;}).join(", ");
 toast(msg);
}
function scrollCur(){var el=$("#t3 .st-cur");if(el&&!$("#t3").hidden)el.scrollIntoView({block:"center",behavior:RM?"auto":"smooth"});}
renderMap();

/* ================= 탭 ================= */
$$(".tab").forEach(function(t){t.addEventListener("click",function(){
 $$(".tab").forEach(function(x){x.setAttribute("aria-selected",String(x===t));});
 $$(".tp").forEach(function(p){p.hidden=p.id!==t.dataset.t;});
 window.scrollTo(0,0);
 if(t.dataset.t==="t3")setTimeout(scrollCur,80);
});});
})();
</script>
